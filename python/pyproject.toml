[project]
name = "mkseo-ai"
version = "0.1.0"
description = "Shared Python configuration and PydanticAI model adapters"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "httpx2>=2.13.1",
  "pydantic>=2.14.1",
  "pydantic-ai-slim[google,openai]>=2.57.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.uv]
exclude-newer = "1 week"
# Apply emergency certificate trust updates without the release delay.
exclude-newer-package = { certifi = false }

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests", "check.py"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
