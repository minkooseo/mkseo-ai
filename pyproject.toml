[project]
name = "mkseo-ai"
version = "0.1.0"
description = "Shared Python configuration and PydanticAI model adapters"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx2>=2.12.0",
  "pydantic>=2.13.4",
  "pydantic-ai-slim[google,openai]>=2.17.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyright>=1.1.411", "pytest>=9.1.1", "ruff>=0.16.0"]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
